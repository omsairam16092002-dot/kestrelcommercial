name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @kestrel/shared

      - name: Run Lighthouse against production
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_SITE_URL: https://kestrel-commercial.vercel.app
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
